<body><div class="shell">
<header class="top"><h1>LIFE CALENDAR</h1><div class="yearnav"><button id="prev" class="icon" aria-label="Previous year">‹</button><span id="year" class="year"></span><button id="next" class="icon" aria-label="Next year">›</button><button id="today">Today</button></div><div class="spacer"></div><input id="search" class="search" type="search" placeholder="Search events…"><button id="mobileSearchButton" class="mobileSearchButton" aria-label="Search events" aria-expanded="false">⌕</button><button id="add" class="primary" aria-label="Add event">+ <span class="labelHide">Event</span></button><button id="more" aria-label="Settings and backup">☰ <span class="labelHide">More</span></button><button id="install" class="install">Install</button></header>
<div id="mobileSearchPanel" class="mobileSearchPanel"><input id="mobileSearch" class="mobileSearch" type="search" placeholder="Search events…" aria-label="Search events"></div>
<div id="status" class="status"></div><main id="months" class="months" aria-live="polite"></main></div>
<div id="eventModal" class="modal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="eventHeading"><h2 id="eventHeading">Add event</h2><form id="eventForm" class="form">
<input id="eventId" type="hidden"><div class="field full"><label for="title">Title</label><input id="title" required maxlength="120" autofocus></div>
<div class="field"><label for="start">Start date</label><input id="start" type="date" required></div><div class="field"><label for="end">End date</label><input id="end" type="date" required></div>
<div class="field"><label for="category">Category</label><select id="category"></select></div><div class="field"><label for="repeat">Repeat</label><select id="repeat"><option value="none">Does not repeat</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
<div class="field full"><label class="check"><input id="allDay" type="checkbox" checked> All-day event</label></div><div id="timeFields" class="field full" style="display:none"><div class="form"><div class="field"><label for="startTime">Start time</label><input id="startTime" type="time"></div><div class="field"><label for="endTime">End time</label><input id="endTime" type="time"></div></div></div>
<div class="field full"><label for="notes">Notes</label><textarea id="notes" maxlength="1000"></textarea></div></form><div class="actions"><button id="deleteEvent" class="danger left" style="display:none">Delete</button><button data-close="eventModal">Cancel</button><button id="saveEvent" class="primary">Save</button></div></section></div>
<div id="moreModal" class="modal"><section class="dialog"><h2>Calendar settings</h2><div class="settingsList"><div class="field"><label for="weekStart">Week starts on</label><select id="weekStart"><option value="1">Monday</option><option value="0">Sunday</option></select></div><div><strong>Categories</strong><div id="categoryEditor"></div><button id="addCategory">+ Category</button></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><button id="exportBtn">Export backup</button><button id="importBtn">Import backup</button><button id="restoreBtn">Restore previous backup</button><input id="importFile" type="file" accept="application/json,.json" hidden><div class="meta">Events are stored locally on this device using IndexedDB. An automatic recovery snapshot is created before destructive changes and imports.</div></div><div class="actions"><button data-close="moreModal">Close</button></div></section></div><div id="toast" class="toast"></div>
<script>
'use strict';
const DB_NAME='life-calendar-v1', DB_VERSION=1;let db,year=new Date().getFullYear(),events=[],categories=[],settings={weekStart:1},deferredInstall=null;
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function localISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;['events','categories','settings','backups'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,value){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)})}
function del(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function seed(){categories=await all('categories');if(!categories.length){categories=[{id:'personal',name:'Personal',color:'#d0ad28'},{id:'family',name:'Family',color:'#4c78c8'},{id:'birthday',name:'Birthday',color:'#9b63c8'},{id:'bill',name:'Bill / Renewal',color:'#c95c55'},{id:'holiday',name:'Holiday / Leave',color:'#4e9b73'}];for(const c of categories)await put('categories',c)}const s=await all('settings');Object.assign(settings,...s.map(x=>({[x.id]:x.value})));events=await all('events')}
function dateUTC(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}function daysIn(y,m){return new Date(y,m+1,0).getDate()}function occurrenceFor(e,y,m){let out=[];const start=dateUTC(e.start),end=dateUTC(e.end),dur=Math.max(0,Math.round((end-start)/86400000));if(e.repeat==='none'){if(start.getUTCFullYear()===y&&start.getUTCMonth()===m||end.getUTCFullYear()===y&&end.getUTCMonth()===m||start<=new Date(Date.UTC(y,m+1,0))&&end>=new Date(Date.UTC(y,m,1)))out.push({start:e.start,end:e.end})}else if(e.repeat==='yearly'){if(start.getUTCMonth()===m){let d=Math.min(start.getUTCDate(),daysIn(y,m));let a=new Date(Date.UTC(y,m,d)),b=new Date(a.getTime()+dur*86400000);out.push({start:a.toISOString().slice(0,10),end:b.toISOString().slice(0,10)})}}else if(e.repeat==='monthly'){let d=Math.min(start.getUTCDate(),daysIn(y,m));let a=new Date(Date.UTC(y,m,d)),b=new Date(a.getTime()+dur*86400000);if(a>=start)out.push({start:a.toISOString().slice(0,10),end:b.toISOString().slice(0,10)})}return out}
function inRange(day,a,b){return day>=a&&day<=b}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(a,b){const d=dateUTC(a),e=dateUTC(b),o={day:'numeric',month:'short',timeZone:'UTC'};return a===b?d.toLocaleDateString(undefined,o):`${d.toLocaleDateString(undefined,o)} – ${e.toLocaleDateString(undefined,o)}`}
function render(){const q=($('#search').value||$('#mobileSearch').value).trim().toLowerCase();$('#year').textContent=year;const names=[...Array(12)].map((_,m)=>new Date(year,m,1).toLocaleString(undefined,{month:'long'}));let total=0;$('#months').innerHTML=names.map((name,m)=>{let list=[];for(const e of events){if(q&&!(`${e.title} ${e.notes||''}`.toLowerCase().includes(q)))continue;for(const o of occurrenceFor(e,year,m))list.push({e,o})}list.sort((a,b)=>a.o.start.localeCompare(b.o.start)||(a.e.startTime||'').localeCompare(b.e.startTime||''));total+=list.length;const first=new Date(Date.UTC(year,m,1)).getUTCDay(),offset=(first-Number(settings.weekStart)+7)%7,cells=[];for(let i=0;i<offset;i++)cells.push('<div class="day blank">0</div>');for(let d=1;d<=daysIn(year,m);d++){const iso=`${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,hits=list.filter(x=>inRange(iso,x.o.start,x.o.end));const range=hits.some(x=>x.o.start!==x.o.end),today=iso===localISO();cells.push(`<div class="day ${hits.length?'has':''} ${range?'range':''} ${today?'today':''}" title="${hits.map(x=>esc(x.e.title)).join(', ')}">${d}</div>`)}const rows=list.length?list.map(({e,o})=>{const c=categories.find(x=>x.id===e.categoryId)||{color:'#c5aa2f',name:'Uncategorised'};return `<article class="eventrow" data-id="${e.id}" tabindex="0"><div class="date">${fmtDate(o.start,o.end)}</div><span class="dot" style="background:${c.color}"></span><div><div class="eventtitle">${esc(e.title)}</div><div class="meta">${e.allDay?'All day':`${esc(e.startTime||'')}–${esc(e.endTime||'')}`} · ${esc(c.name)}${e.repeat!=='none'?` · ${e.repeat}`:''}</div></div></article>`}).join(''):'<div class="empty">No events</div>';return `<section class="month" id="month-${m+1}"><div class="mini"><h2>${name.toUpperCase()}</h2><div class="week">${weekLabels().map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells.join('')}</div></div><div class="events"><h3>${name}</h3>${rows}</div></section>`}).join('');$('#status').textContent=q?`${total} matching occurrence${total===1?'':'s'} in ${year}`:`${events.length} local event${events.length===1?'':'s'} · Saved on this device`;document.querySelectorAll('.eventrow').forEach(x=>{x.onclick=()=>openEvent(x.dataset.id);x.onkeydown=e=>{if(e.key==='Enter')openEvent(x.dataset.id)}})}
function weekLabels(){const a=['S','M','T','W','T','F','S'];return Number(settings.weekStart)===1?[...a.slice(1),a[0]]:a}function show(id){$('#'+id).classList.add('open')}function hide(id){$('#'+id).classList.remove('open')}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function fillCategories(){const options=categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('#category').innerHTML=options;$('#categoryEditor').innerHTML=categories.map(c=>`<div class="catrow"><input type="color" value="${c.color}" data-color="${c.id}" aria-label="${esc(c.name)} colour"><input value="${esc(c.name)}" data-name="${c.id}" maxlength="28"><button class="danger" data-catdelete="${c.id}" ${categories.length===1?'disabled':''}>×</button></div>`).join('')}
function openEvent(id=null){$('#eventForm').reset();$('#eventId').value=id||'';$('#allDay').checked=true;$('#timeFields').style.display='none';$('#repeat').value='none';$('#start').value=localISO();$('#end').value=localISO();$('#category').value=categories[0]?.id||'';$('#deleteEvent').style.display=id?'block':'none';$('#eventHeading').textContent=id?'Edit event':'Add event';if(id){const e=events.find(x=>x.id===id);for(const k of ['title','start','end','categoryId','repeat','notes','startTime','endTime']){const el=$('#'+(k==='categoryId'?'category':k));if(el)el.value=e[k]||''}$('#allDay').checked=e.allDay;$('#timeFields').style.display=e.allDay?'none':'block'}show('eventModal');setTimeout(()=>$('#title').focus(),50)}
async function snapshot(label){const data={id:Date.now().toString(),label,createdAt:new Date().toISOString(),events:await all('events'),categories:await all('categories'),settings};await put('backups',data);const bs=(await all('backups')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));for(const b of bs.slice(5))await del('backups',b.id)}
async function saveEvent(){if(!$('#eventForm').reportValidity())return;if($('#end').value<$('#start').value)return toast('End date cannot be before start date');const allDay=$('#allDay').checked;if(!allDay&&(!$('#startTime').value||!$('#endTime').value))return toast('Enter start and end times');const id=$('#eventId').value||uid();const old=events.find(e=>e.id===id);if(old)await snapshot('Before event update');const e={id,title:$('#title').value.trim(),start:$('#start').value,end:$('#end').value,allDay,startTime:allDay?'':$('#startTime').value,endTime:allDay?'':$('#endTime').value,categoryId:$('#category').value,repeat:$('#repeat').value,notes:$('#notes').value.trim(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};await put('events',e);events=await all('events');hide('eventModal');render();toast(old?'Event updated':'Event added')}
async function removeEvent(){const id=$('#eventId').value;if(!id||!confirm('Delete this event?'))return;await snapshot('Before event deletion');await del('events',id);events=await all('events');hide('eventModal');render();toast('Event deleted')}
function exportData(){const data={app:'Life Calendar',schemaVersion:1,exportedAt:new Date().toISOString(),events,categories,settings};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`life-calendar-backup-${localISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){try{const data=JSON.parse(await file.text());if(data.app!=='Life Calendar'||!Array.isArray(data.events)||!Array.isArray(data.categories))throw Error('Invalid Life Calendar backup');await snapshot('Before import');for(const s of ['events','categories'])await new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=res;r.onerror=()=>rej(r.error)});for(const e of data.events)await put('events',e);for(const c of data.categories)await put('categories',c);for(const [id,value] of Object.entries(data.settings||{}))await put('settings',{id,value});await seed();fillCategories();render();hide('moreModal');toast('Backup imported')}catch(e){toast(e.message||'Import failed')}}
async function restore(){const bs=(await all('backups')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(!bs.length)return toast('No recovery backup available');if(!confirm(`Restore backup from ${new Date(bs[0].createdAt).toLocaleString()}?`))return;await snapshot('Before recovery restore');for(const s of ['events','categories'])await new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=res;r.onerror=()=>rej(r.error)});for(const e of bs[0].events)await put('events',e);for(const c of bs[0].categories)await put('categories',c);for(const [id,value] of Object.entries(bs[0].settings||{}))await put('settings',{id,value});await seed();fillCategories();render();hide('moreModal');toast('Recovery restored')}
async function init(){await openDB();await seed();fillCategories();render();$('#prev').onclick=()=>{year--;render();scrollTo(0,0)};$('#next').onclick=()=>{year++;render();scrollTo(0,0)};$('#today').onclick=()=>{year=new Date().getFullYear();render();setTimeout(()=>document.querySelector('.today')?.scrollIntoView({block:'center'}),0)};$('#mobileSearchButton').onclick=()=>{const panel=$('#mobileSearchPanel'),open=!panel.classList.contains('open');panel.classList.toggle('open',open);$('#mobileSearchButton').setAttribute('aria-expanded',String(open));if(open)setTimeout(()=>$('#mobileSearch').focus(),0)};$('#add').onclick=()=>openEvent();$('#more').onclick=()=>{fillCategories();$('#weekStart').value=settings.weekStart;show('moreModal')};$('#saveEvent').onclick=saveEvent;$('#deleteEvent').onclick=removeEvent;$('#allDay').onchange=e=>$('#timeFields').style.display=e.target.checked?'none':'block';['search','mobileSearch'].forEach(id=>$('#'+id).oninput=e=>{const other=id==='search'?'mobileSearch':'search';$('#'+other).value=e.target.value;render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)hide(m.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.open').forEach(m=>hide(m.id));$('#mobileSearchPanel').classList.remove('open');$('#mobileSearchButton').setAttribute('aria-expanded','false')}if(e.key.toLowerCase()==='n'&&!document.querySelector('.modal.open')&&!['INPUT','TEXTAREA'].includes(e.target.tagName))openEvent()});$('#weekStart').onchange=async e=>{settings.weekStart=Number(e.target.value);await put('settings',{id:'weekStart',value:settings.weekStart});render()};$('#addCategory').onclick=async()=>{const c={id:uid(),name:'New category',color:'#6b7f99'};await put('categories',c);categories=await all('categories');fillCategories()};$('#categoryEditor').onchange=async e=>{const id=e.target.dataset.name||e.target.dataset.color;if(!id)return;const c=categories.find(x=>x.id===id);if(e.target.dataset.name)c.name=e.target.value.trim()||'Category';else c.color=e.target.value;await put('categories',c);fillCategories();render()};$('#categoryEditor').onclick=async e=>{const id=e.target.dataset.catdelete;if(!id||categories.length===1)return;if(events.some(x=>x.categoryId===id)&&!confirm('Delete this category? Its events will become uncategorised.'))return;await snapshot('Before category deletion');await del('categories',id);categories=await all('categories');fillCategories();render()};$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};$('#restoreBtn').onclick=restore;if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#install').style.display='block'});$('#install').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#install').style.display='none'}}}
init().catch(e=>{console.error(e);document.body.innerHTML='<p style="padding:20px">Life Calendar could not open local storage. Please check browser storage permissions.</p>'});
</script></body></html>
